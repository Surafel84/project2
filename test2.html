
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Workshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
    <header class="bg-dark text-white">
        <div class="container py-5">
            <span class="badge bg-warning text-dark mb-3">Free workshop</span>
            <h1 class="display-5 fw-bold">Web Design Workshop</h1>
            <p class="lead mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
        </div>
    </header>
    <main class="container py-4 py-md-5">
        <div class="row g-4">
            <section class="col-12 col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Workshop details</h2>
                        <dl class="mb-0">
                            <dt>Day</dt>
                            <dd class="mb-3">Saturday</dd>
                            <dt>Location</dt>
                            <dd class="mb-3">School computer lab</dd>
                            <dt>What to bring</dt>
                            <dd class="mb-0">A laptop and charger</dd>
                        </dl>
                    </div>
                </div>
            </section>
            <section class="col-12 col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Register for a session</h2>
                        <form action="#register-heading">
                            <div class="mb-3">
                                <label for="full-name" class="form-label">Full name
                                </label>
                                <input
                                    type="text"
                                    id="full-name"
                                    class="form-control"
                                    autocomplete="name"
                                    required
                                >
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                            <fieldset class="mb-4">
                                <legend class="fs-6 fw-semibold">Choose a Session</legend>
                                <div class="form-check">
                                    <input
                                        type="radio"
                                        id="morning"
                                        name="session"
                                        value="morning"
                                        class="form-check-input"
                                        required
                                    >
                                    <label for="morning" class="form-check-label">Morning · 9:00–11:00 AM</label>
                                </div>
                                <div class="form-check">
                                    <input
                                        type="radio"
                                        id="afternoon"
                                        name="session"
                                        value="afternoon"
                                        class="form-check-input"
                                        required
                                    >
                                    <label for="afternoon" class="form-check-label">Afternoon · 2:00–4:00 PM</label>
                                </div>
                            </fieldset>
                            <div class="d-grid d-sm-block">
                                <button type="submit" class="btn btn-primary px-4">Register</button>
                            </div>
                            <p class="form-text mt-3 mb-0">Practice form. Entries are discarded.</p>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
